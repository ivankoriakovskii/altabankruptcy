<style>
/* Layout: two strands merge into one line of years; that line drives a tree of circles below it.
   A ring around each circle is the owner's share, its colour is the sector, a click opens the slip. */
:root {
  --b-cash: #F6BD3B; --b-cash-t: #1E1503; --b-oth: #EC6A34; --b-oth-t: #1E1003; --b-loan: #B5316F; --b-loan-t: #FFFFFF; --d-ins: #1F6FD6; --d-ins-t: #FFFFFF; --d-over: #33C3C9; --d-over-t: #04181A;
  --paper: #F2F3F7; --sheet: #FCFCFE; --ink: #131829; --ink-2: #464D63; --ink-3: #626980;
  --rule: #CBD0DC; --line: #9AA1B4; --pecat: #2C38A0; --stecaj: #B3261E; --stecaj-t: #FFFFFF; --dep: var(--ink-3); --dep-t: var(--paper);
  --fin: #3F5BC4; --fin-t: #FFFFFF; --build: #0B8F87; --build-t: #10131C;
  --retail: #B0761A; --retail-t: #10131C; --other: #7A55C7; --other-t: #FFFFFF;
  --display: "Sofia Sans Extra Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Golos Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12151F; --sheet: #1B1F2C; --ink: #E8EAF2; --ink-2: #B7BCCD; --ink-3: #9097AB;
  --rule: #2F3447; --line: #5A637B; --pecat: #A7B0FF; --stecaj: #FF8D7E; --stecaj-t: #10131C;
  --fin: #5D78E0; --fin-t: #10131C; --build: #149C93; --build-t: #10131C;
  --retail: #B98322; --retail-t: #10131C; --other: #9575DC; --other-t: #10131C; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #12151F; --sheet: #1B1F2C; --ink: #E8EAF2; --ink-2: #B7BCCD; --ink-3: #9097AB;
  --rule: #2F3447; --line: #5A637B; --pecat: #A7B0FF; --stecaj: #FF8D7E; --stecaj-t: #10131C;
  --fin: #5D78E0; --fin-t: #10131C; --build: #149C93; --build-t: #10131C;
  --retail: #B98322; --retail-t: #10131C; --other: #9575DC; --other-t: #10131C; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--body); }
a { color: var(--pecat); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--pecat); outline-offset: 2px; }
.wrap { max-width: 1340px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 48px; display: grid; gap: 40px; }
.wrap > * { min-width: 0; }
h1, h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .96; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.9rem, 7.4vw, 5.4rem); overflow-wrap: anywhere; }
h2 { font-size: clamp(2.2rem, 4.6vw, 3.2rem); }
p { margin: 0; }
header { display: grid; gap: 12px; }
.lang { flex: none; display: inline-flex; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
.lang button { font: 500 .8rem/1 var(--mono); padding: 10px 13px; background: transparent; color: var(--ink); border: 0; cursor: pointer; }
.lang button:hover { background: var(--sheet); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lang button:focus-visible { outline-offset: -4px; }
.lede { font-size: 1.12rem; max-width: 62ch; }
.asof { justify-self: start; align-self: start; font: 500 .92rem/1.35 var(--body); color: var(--ink-2); }
.status { font: 400 .78rem/1.5 var(--mono); color: var(--ink-3); max-width: 90ch; }

.stage { display: grid; gap: 16px; }
.stage > * { min-width: 0; }
#scrub { display: block; width: 100%; overflow: visible; }
.lane { fill: none; stroke-linecap: round; }
.lane--bank { stroke: var(--ink-3); stroke-width: 3; }
.lane--biz { stroke: var(--pecat); stroke-width: 3; }
.lane--main { stroke: var(--pecat); stroke-width: 5; }
.lane-t { font: 400 11px var(--mono); fill: var(--ink-3); }
.stop { cursor: pointer; outline: none; }
.stop .hit { fill: transparent; }
.stop .dot { fill: var(--sheet); stroke: var(--pecat); stroke-width: 2.5; transition: r .2s; }
.stop.bank .dot { stroke: var(--ink-3); }
.stop.past .dot { fill: var(--pecat); }
.stop.bank.past .dot { fill: var(--ink-3); }
.stop.end .dot { stroke: var(--stecaj); }
.stop.end.past .dot { fill: var(--stecaj); }
.stop.on .dot { r: 11px; }
.stop .yr { font: 500 12px var(--mono); fill: var(--ink-3); text-anchor: middle; }
.stop.on .yr { fill: var(--ink); }
.stop:hover .dot { stroke-width: 4; }
.stop:focus-visible .dot { stroke: var(--ink); stroke-width: 4; }
.cap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 3px; padding: 10px 14px; min-height: 76px; }
.capy { font: 800 2.5rem/1 var(--display); }
.cap p { font-size: .96rem; line-height: 1.4; max-width: 86ch; }
#play { font: 500 .78rem/1 var(--mono); color: var(--pecat); background: transparent; border: 1.5px solid currentColor; border-radius: 3px; padding: 9px 11px; cursor: pointer; white-space: nowrap; }
#play:hover { background: var(--paper); }

.board { display: grid; gap: 20px; align-items: start; }
.board > * { min-width: 0; }
#graph { display: block; width: 100%; }
.l { fill: none; stroke: var(--line); stroke-width: 1.6; transition: opacity .35s; }
.l.dash { stroke-dasharray: 5 5; }
.l.on { stroke: var(--pecat); stroke-width: 2.6; }
.n { cursor: pointer; outline: none; transition: opacity .35s; }
.ghost { opacity: .11; }
.n.ghost { pointer-events: none; cursor: default; }
.track { fill: none; stroke: var(--rule); stroke-width: 3; }
.n.unk .track { stroke: var(--line); stroke-dasharray: 3 4; }
.arc { fill: none; stroke-width: 3; stroke-linecap: butt; transition: stroke-dasharray .6s ease; }
.n.red .track, .n.red .arc { stroke: var(--stecaj); }
.disc { stroke-width: 2; }
.frame { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.pct { font-family: var(--display); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
.sel { fill: none; stroke: var(--pecat); stroke-width: 2; opacity: 0; }
.n.picked .sel, .n:focus-visible .sel, .n:hover .sel { opacity: 1; }
.nm, .wh, .fl { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.nm { font: 600 13.5px var(--body); fill: var(--ink); }
.nm.big { font-size: 15px; }
.wh { font: 400 11px var(--mono); fill: var(--ink-3); }
.fl { font: 500 10.5px var(--mono); fill: var(--stecaj); text-transform: uppercase; letter-spacing: .04em; }
.keys { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: .82rem; color: var(--ink-2); }
.keys li { display: inline-flex; align-items: center; gap: 7px; }
.keys svg { flex: none; }

.slip { background: var(--sheet); border: 1px solid var(--ink); border-radius: 3px; padding: 15px; display: grid; gap: 10px; }
.slip > * { min-width: 0; }
.slip[hidden] { display: none; }
.chain { font: 400 .72rem/1.45 var(--mono); color: var(--ink-3); }
.slip h3 { font: 800 1.85rem/1 var(--display); text-transform: uppercase; margin: 0; padding-right: 26px; }
.when { font: 500 .8rem/1.4 var(--mono); color: var(--ink-2); }
.pts { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: .9rem; line-height: 1.42; }
.src { font-size: .76rem; color: var(--ink-3); white-space: normal; }
.src a { color: inherit; }
.src a:hover { color: var(--pecat); }
.x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; background: transparent; border: 0; color: var(--ink-2); font-size: 20px; line-height: 1; cursor: pointer; display: none; }

.steps { display: grid; gap: 18px; }
.rings { display: grid; gap: 18px 24px; grid-template-columns: minmax(0, 1fr); }
.ring { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; }
.ring svg { display: block; }
.ring b { display: block; font: 500 .8rem/1.35 var(--mono); }
.ring span { display: block; font-size: .88rem; line-height: 1.35; color: var(--ink-2); margin-top: 2px; }

details { font-size: .86rem; }
summary { cursor: pointer; font-weight: 600; }
.srcs { list-style: none; margin: 12px 0 0; padding: 0; columns: 2 300px; column-gap: 28px; }
.srcs li { break-inside: avoid; padding-bottom: 8px; line-height: 1.35; }
.srcs small { display: block; color: var(--ink-3); font: 400 .7rem/1.4 var(--mono); }
.note { font-size: .82rem; color: var(--ink-2); max-width: 86ch; margin-top: 12px; }

/* Top bar: two views of one site, language on the right */
.bar { display: flex; flex-wrap: wrap-reverse; gap: 8px 20px; justify-content: space-between; align-items: flex-end; border-bottom: 1.5px solid var(--ink); }
.bar > .lang { margin: 0 0 8px auto; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; min-width: 0; }
.tabs button { font: 800 1.45rem/1 var(--display); text-transform: uppercase; letter-spacing: .02em; padding: 10px 14px 8px; min-height: 44px; background: transparent; color: var(--ink-3); border: 0; border-bottom: 4px solid transparent; margin-bottom: -1.5px; cursor: pointer; }
.tabs button:first-child { padding-left: 0; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pecat); }
.tabs button:focus-visible { outline-offset: -2px; }
@media (max-width: 620px) { .tabs { column-gap: 22px; } .tabs button { padding-left: 0; padding-right: 0; } }
.view { display: grid; gap: 40px; }
.view > * { min-width: 0; }
.sub { font-size: .95rem; color: var(--ink-2); max-width: 74ch; margin-top: 8px; }
.sec { display: grid; gap: 18px; }
.sec > * { min-width: 0; }
.sec-h { display: grid; gap: 0; }

.fine { font-size: .82rem; line-height: 1.45; color: var(--ink-2); max-width: 86ch; }

/* A balance: what the bank can gather against what the first queue claims. Circle area is the sum. */
#vs { width: 100%; }
#scaleSvg { display: block; width: 100%; height: auto; overflow: visible; }
#scaleSvg text { font-family: var(--body); fill: var(--ink); }
#scaleSvg .n { font-family: var(--display); font-weight: 800; }
#scaleSvg .m { font-family: var(--mono); fill: var(--ink-2); }
.tot { display: flex; flex-wrap: wrap; gap: 18px clamp(20px, 5vw, 56px); align-items: center; justify-content: center; }
.gau { display: flex; align-items: center; gap: 12px; min-width: 0; }
.gau svg { flex: none; }
.gau span { display: block; font-size: .86rem; line-height: 1.3; color: var(--ink-2); }
.gau b { display: block; font: 800 1.9rem/1.05 var(--display); }
.gau b::first-letter { text-transform: uppercase; }
.tot p { flex: 1 1 260px; max-width: 46ch; font-size: .92rem; line-height: 1.4; }
.ppl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.ppl svg { flex: none; color: var(--ink-2); }
.ppl .pg { display: flex; align-items: center; gap: 8px; }
.ppl span { font-size: .9rem; line-height: 1.3; }
.ppl b { font: 800 1.5rem/1 var(--display); }
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px clamp(14px, 3vw, 32px); }
.fg { display: grid; gap: 5px; justify-items: start; align-content: start; min-width: 0; }
.fg span { font-size: .84rem; line-height: 1.3; color: var(--ink-2); }
.fg b { font: 800 1.7rem/1.05 var(--display); }
.fg small { font: 400 .72rem/1.4 var(--mono); color: var(--ink-3); }
.sx { display: grid; gap: 14px 40px; }
.sx > .fine { margin: 0; }
.sx h4 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); font-size: 1rem; font-weight: 700; }
.sx h4 s, .sx li s { text-decoration: none; font-weight: 800; white-space: nowrap; }
.sx ul { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 12px; }
.sx li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 3px 10px; align-items: baseline; }
.sx li em { width: 12px; height: 12px; border-radius: 3px; align-self: center; }
.sx li b { font-weight: 600; }
.sx li p { grid-column: 2 / -1; margin: 0; font-size: .86rem; line-height: 1.45; color: var(--ink-2); }
@media (min-width: 860px) { .sx { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sx > .fine { grid-column: 1 / -1; } }
.hb { display: grid; gap: 9px; justify-self: stretch; margin-top: 2px; }
.hb-r { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 3px 8px; }
.hb-r em { font-style: normal; font-size: .8rem; line-height: 1.25; color: var(--ink-2); min-width: 0; }
.hb-r s { text-decoration: none; font: 800 1.05rem/1.1 var(--display); white-space: nowrap; }
.hb-t { flex: 1 0 100%; position: relative; height: 10px; border-radius: 5px; background: var(--rule); }
.hb-t i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.hb-t u { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
@media (min-width: 720px) {
  .figs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* Bank parameters */
.paper { border-left: 4px solid var(--stecaj); padding: 4px 0 4px 14px; font-size: 1rem; line-height: 1.45; max-width: 78ch; }

/* Cash chart */
.twin { display: grid; gap: 24px 40px; align-items: start; }
.twin > * { min-width: 0; }
#chart { display: block; width: 100%; }
.b-v { font: 500 12px var(--mono); fill: var(--ink); text-anchor: middle; }
.d-v { font: 400 11px var(--mono); fill: var(--ink-2); text-anchor: middle; }
.x-t { font: 400 12px var(--mono); fill: var(--ink-3); text-anchor: middle; }
.base { stroke: var(--line); stroke-width: 1; }
.dep-l { fill: none; stroke: var(--dep); stroke-width: 2; stroke-linecap: round; }
.tw { margin-top: 10px; }
.tbl { overflow-x: auto; margin-top: 8px; }
.tbl table { border-collapse: collapse; font-size: .82rem; min-width: 460px; width: 100%; }
.tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
.tbl tbody th { text-align: left; font-weight: 400; color: var(--ink-2); white-space: normal; min-width: 170px; }
.tbl td { font: 400 .78rem/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.tbl thead th { font: 500 .74rem/1.3 var(--mono); color: var(--ink-3); }
.cols { display: grid; gap: 22px; }
.rng { display: grid; gap: 5px; }
.rng-h { font-size: .9rem; font-weight: 600; }
.rng-a, .rng-b { position: relative; height: 18px; font: 400 .74rem/18px var(--mono); color: var(--ink-2); }
.rng-a span, .rng-b span { position: absolute; white-space: nowrap; }
.rng-a span { color: var(--ink); font-weight: 500; }
.rng-t { position: relative; height: 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; }
.rng-t i { position: absolute; top: -1px; bottom: -1px; background: var(--line); border-radius: 5px; }
.rng-t u { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--fin); border: 2px solid var(--paper); }

/* Balance: where the money came from and where it sat */
.bal { display: grid; gap: 14px; }
.bal-r { display: grid; gap: 5px; }
.bal-h { font-size: .9rem; font-weight: 600; }
.seg { display: flex; gap: 2px; height: 28px; }
.seg > div { min-width: 0; border-radius: 4px; font: 500 .74rem/28px var(--mono); padding-inline: 8px; white-space: nowrap; overflow: hidden; }
.seg-k { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 3px 16px; font-size: .82rem; color: var(--ink-2); }
.seg-k li { display: inline-flex; align-items: baseline; gap: 6px; }
.seg-k em { width: 9px; height: 9px; border-radius: 2px; flex: none; align-self: center; }

/* October flows */
#flow { display: block; width: 100%; }
.l[data-fl="vault"] { stroke: var(--stecaj); stroke-width: 2.6; }
.fe { fill: none; }
.fe.jtok { stroke: var(--stecaj); }
.fe.press { stroke: var(--line); stroke-width: 1.8; stroke-dasharray: 5 5; }
.fe.off { stroke: var(--fin); stroke-width: 2.2; }
.fa.jtok { fill: var(--stecaj); }
.fa.press { fill: var(--line); }
.fa.off { fill: var(--fin); }
.n.picked .fe.press, .n:hover .fe.press { stroke: var(--pecat); }
.n.picked .fa.press, .n:hover .fa.press { fill: var(--pecat); }
.fd { stroke-width: 2; }
.fd.jtok { fill: var(--stecaj); stroke: var(--stecaj); }
.fd.press { fill: var(--sheet); stroke: var(--line); stroke-dasharray: 3 3; }
.fd.off { fill: var(--fin); stroke: var(--fin); }
.ft { font-family: var(--display); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
.ft.jtok { fill: var(--stecaj-t); }
.ft.press { fill: var(--ink); }
.ft.off { fill: var(--fin-t); }
.lv { font: 500 10.5px var(--mono); fill: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.bank-t { font: 800 21px var(--display); fill: var(--fin-t); text-anchor: middle; dominant-baseline: central; }
.tag { display: inline-flex; align-items: center; gap: 6px; font: 500 .72rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.tag i { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* Chronology */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl > li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 12px; padding-bottom: 18px; position: relative; }
.tl > li::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: -8px; width: 2px; background: var(--rule); }
.tl > li:last-child::before { display: none; }
.tl-d { width: 14px; height: 14px; border-radius: 50%; margin-top: 4px; position: relative; background: var(--sheet); border: 2px solid var(--pecat); }
.tl .hot .tl-d { background: var(--pecat); }
.tl .end .tl-d { background: var(--stecaj); border-color: var(--stecaj); }
.tl-b { display: grid; gap: 5px; min-width: 0; }
.tl-w { font: 500 .84rem/1.4 var(--mono); }
.tl-b ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .94rem; line-height: 1.42; max-width: 78ch; }

.unk { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.unk li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: .95rem; line-height: 1.42; max-width: 86ch; }
.unk em { width: 24px; height: 24px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font: 800 .95rem/1 var(--display); font-style: normal; }

@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 860px) {
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .twin { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .tl > li { grid-template-columns: 16px 132px minmax(0, 1fr); }
  .tl-b { display: contents; }
  .tl-b > ul { grid-column: 3; }
  .tl-w { grid-column: 2; padding-top: 1px; }
}

/* Payouts: who is paid, in what order, what could be left */
.pstep { display: grid; gap: 12px; padding-top: 6px; }
.pstep > * { min-width: 0; }
.pstep h3 { font: 800 1.55rem/1.05 var(--display); text-transform: uppercase; margin: 0; }
.who { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.who > div { background: var(--sheet); padding: 13px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.who span { font-size: .86rem; color: var(--ink-2); }
.who b { font: 800 1.75rem/1.05 var(--display); }
.who p { font-size: .9rem; line-height: 1.42; }
.lad { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.lad > li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 12px; padding-bottom: 12px; position: relative; }
.lad > li::before { content: ""; position: absolute; left: 16px; top: 16px; bottom: -4px; width: 2px; background: var(--rule); }
.lad > li:last-child::before { display: none; }
.lad em { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 800 1.02rem/1 var(--display); font-style: normal; background: var(--sheet); border: 2px solid var(--line); position: relative; }
.lad .pay0 em { background: var(--build); border-color: var(--build); color: var(--build-t); }
.lad .pay1 em { background: var(--fin); border-color: var(--fin); color: var(--fin-t); }
.lad b { display: block; font-weight: 600; font-size: .96rem; line-height: 1.3; }
.lad p { font-size: .88rem; line-height: 1.4; color: var(--ink-2); max-width: 78ch; }
.scn { display: inline-flex; width: fit-content; max-width: 100%; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
.scn button { font: 500 .8rem/1 var(--mono); padding: 11px 14px; background: transparent; color: var(--ink); border: 0; cursor: pointer; }
.scn button:hover { background: var(--sheet); }
.scn button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.scn button:focus-visible { outline-offset: -4px; }
.sl { display: grid; gap: 16px 32px; }
.sl > div { display: grid; gap: 3px; min-width: 0; }
.sl label { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: .9rem; font-weight: 600; line-height: 1.3; }
.sl output { font: 500 .86rem/1.3 var(--mono); white-space: nowrap; }
.sl input { width: 100%; height: 28px; margin: 0; accent-color: var(--pecat); cursor: pointer; }
.sl small { font-size: .78rem; line-height: 1.4; color: var(--ink-3); }
.wf { display: grid; gap: 7px; }
.wf-r { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: baseline; }
.wf-l { font-size: .88rem; line-height: 1.3; min-width: 0; }
.wf-r.tot .wf-l { font-weight: 600; }
.wf-v { font: 500 .84rem/1.3 var(--mono); white-space: nowrap; grid-column: 2; grid-row: 1; }
.wf-t { grid-column: 1 / -1; grid-row: 2; position: relative; height: 16px; background: var(--paper); border-left: 1px solid var(--line); }
.wf-t i { position: absolute; top: 0; bottom: 0; border-radius: 2px; transition: left .25s ease, width .25s ease; }
.res { display: grid; gap: 1px; background: var(--rule); border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
.res > div { background: var(--sheet); padding: 13px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.res span { font-size: .86rem; line-height: 1.3; color: var(--ink-2); }
.res b { font: 800 2.5rem/1 var(--display); }
.res b::first-letter { text-transform: uppercase; }
.res p { font-size: .86rem; line-height: 1.4; }
.mb { display: flex; gap: 2px; height: 8px; margin: 4px 0 3px; }
.mb i { border-radius: 2px; min-width: 0; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .8rem; line-height: 1.3; }
.chips li { background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; }

const FLAT = [], parent = {};
(function walk(n, p, d){ n.d = d; parent[n.id] = p; FLAT.push(n); (n.kids || []).forEach(k => walk(k, n, d + 1)); })(TREE, null, 0);
const byId = Object.fromEntries(FLAT.map(n => [n.id, n]));
const nameAt = (n, y) => { if (!n.names) return T(n.name); let r = n.names[0][1]; n.names.forEach(([a, b]) => { if (a <= y) r = b; }); return T(r); };
const CTRL = L('контр.', 'kontr.'), ASSET = L('актив', 'imov.');
function shareAt(n, y){
  let v = n.share ?? null;
  if (n.shares) { v = null; n.shares.forEach(([a, b]) => { if (a <= y) v = b; }); }
  let t = '';
  if (n.unknown) t = '?';
  else if (n.asset) t = T(ASSET);
  else if (n.control) t = T(CTRL);
  else if (v != null) t = (n.label && n.label[y]) || (String(v).replace('.', ',') + '%');
  return { v, t };
}
const isVis = (n, y) => y === LAST || ((n.born ?? n.since) != null && (n.born ?? n.since) <= y);
const linkVis = (n, y) => y === LAST || (n.since != null && n.since <= y);
const finalName = n => nameAt(n, LAST);

/* Layout: wide = left-to-right tree, narrow = indented list; both use real pixels so text keeps its size */
function layout(W){
  const P = {};
  if (W >= 860) {
    const xs = [.066, .272, .5, .715].map(f => Math.round(W * f));
    const R = n => n.id === 'macura' ? 46 : n.id === 'group' ? 38 : n.id === 'banka' ? 36 : n.id === 'retail' ? 30 : n.id === 'abl' ? 28 : n.small ? 21 : 23;
    let c = 16;
    (function place(n){
      if (n.kids) { n.kids.forEach(place); P[n.id] = { x: xs[n.d], y: (P[n.kids[0].id].y + P[n.kids[n.kids.length - 1].id].y) / 2, r: R(n), below: true }; }
      else { const h = n.h || 72; P[n.id] = { x: xs[n.d], y: c + h / 2, r: R(n), below: false }; c += h; }
    })(TREE);
    return { P, H: c + 22, wide: true };
  }
  let y = 26;
  FLAT.forEach(n => {
    const r = n.id === 'macura' ? 23 : (n.big ? 21 : 18);
    P[n.id] = { x: 25 + n.d * 27, y, r, below: false };
    y += 60 + (n.flag ? 13 : 0);
  });
  return { P, H: y - 14, wide: false };
}

const svg = document.getElementById('graph'), gw = document.getElementById('gw');
let year = LAST, picked = null, built = 0;
function discColor(n){
  if (n.sec === 'person') return ['var(--ink)', 'var(--paper)'];
  if (n.hollow) return ['var(--sheet)', 'var(--ink)'];
  return [`var(--${n.sec})`, `var(--${n.sec}-t)`];
}
function build(){
  const W = gw.clientWidth; if (!W) return; built = W;
  const { P, H, wide } = layout(W);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
  let s = '';
  FLAT.forEach(n => {
    const p = parent[n.id]; if (!p) return;
    const a = P[p.id], b = P[n.id];
    const d = wide
      ? (() => { const x1 = a.x + a.r, x2 = b.x - b.r, m = (x1 + x2) / 2; return `M${x1} ${a.y}C${m} ${a.y} ${m} ${b.y} ${x2} ${b.y}`; })()
      : `M${a.x} ${a.y + a.r}V${b.y}H${b.x - b.r}`;
    s += `<path class="l${n.edge === 'dash' ? ' dash' : ''}" data-l="${n.id}" d="${d}"/>`;
  });
  FLAT.forEach(n => {
    const q = P[n.id], [fill, ink] = discColor(n), rin = q.r - 2, rd = q.r - 6;
    const fs = Math.max(12, Math.round(q.r * .52));
    const stroke = n.sec === 'person' ? 'var(--ink)' : `var(--${n.sec})`;
    const lx = q.below ? q.x : q.x + q.r + 10;
    const anchor = q.below ? 'middle' : 'start';
    const ly = q.below ? q.y + q.r + 18 : q.y - (n.flag ? 8 : 2);
    s += `<g class="n" data-id="${n.id}" role="button" tabindex="0">`
      + `<circle class="sel" cx="${q.x}" cy="${q.y}" r="${q.r + 4}"/>`
      + (n.sec === 'person' || n.asset ? '' : `<circle class="track" cx="${q.x}" cy="${q.y}" r="${rin}"/><circle class="arc" cx="${q.x}" cy="${q.y}" r="${rin}" stroke="${stroke}" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 ${q.x} ${q.y})"/>`)
      + `<circle class="disc" cx="${q.x}" cy="${q.y}" r="${n.sec === 'person' ? q.r : rd}" fill="${fill}"${n.hollow ? ` stroke="${stroke}"` : ''}/>`
      + (n.sec === 'person' ? `<clipPath id="ph"><circle cx="${q.x}" cy="${q.y}" r="${q.r}"/></clipPath><image href="${PHOTO}" x="${q.x - q.r}" y="${q.y - q.r}" width="${q.r * 2}" height="${q.r * 2}" clip-path="url(#ph)"/><circle class="frame" cx="${q.x}" cy="${q.y}" r="${q.r}"/>` : '')
      + `<text class="pct" x="${q.x}" y="${q.y}" font-size="${fs}" fill="${ink}"></text>`
      + `<text class="nm${n.big && wide ? ' big' : ''}" x="${lx}" y="${ly}" text-anchor="${anchor}"></text>`
      + `<text class="wh" x="${lx}" y="${ly + 15}" text-anchor="${anchor}">${T(n.when)}</text>`
      + (n.flag ? `<text class="fl" x="${lx}" y="${ly + 30}" text-anchor="${anchor}">${T(n.flag)}</text>` : '')
      + `</g>`;
  });
  svg.innerHTML = s;
  apply();
}
function apply(){
  if (!svg.firstChild) return;
  FLAT.forEach(n => {
    const g = svg.querySelector(`.n[data-id="${n.id}"]`), vis = isVis(n, year), sh = shareAt(n, year);
    g.classList.toggle('ghost', !vis);
    g.setAttribute('tabindex', vis ? '0' : '-1');
    g.classList.toggle('unk', !!n.unknown);
    g.classList.toggle('red', year === LAST && !!n.flag);
    g.classList.toggle('picked', picked === n.id);
    const nm = nameAt(n, year);
    g.querySelector('.nm').textContent = nm;
    g.querySelector('.pct').textContent = sh.t;
    const arc = g.querySelector('.arc');
    if (arc) arc.setAttribute('stroke-dasharray', `${n.unknown ? 0 : (sh.v || 0)} 100`);
    const fl = g.querySelector('.fl');
    if (fl) fl.style.display = year === LAST ? '' : 'none';
    g.setAttribute('aria-label', `${nm}${sh.v != null ? ', ' + T(U.shareLow) + ' ' + sh.t : ''}, ${T(n.when)}`);
    const l = svg.querySelector(`.l[data-l="${n.id}"]`);
    if (l) l.classList.toggle('ghost', !linkVis(n, year));
  });
  svg.querySelectorAll('.l.on').forEach(e => e.classList.remove('on'));
  for (let x = picked && byId[picked]; x && parent[x.id]; x = parent[x.id]) svg.querySelector(`.l[data-l="${x.id}"]`).classList.add('on');
}

const scrub = document.getElementById('scrub');
function buildScrub(){
  const W = scrub.parentElement.clientWidth; if (!W) return;
  const pad = 24, step = (W - pad * 2) / (STOPS.length - 1), X = i => Math.round(pad + i * step);
  const hi = 24, mid = 44, lo = 64, H = 96;
  const m = (X(2) + X(3)) / 2;
  let s = `<path class="lane lane--bank" d="M${X(0)} ${lo}H${X(2)}C${m} ${lo} ${m} ${mid} ${X(3)} ${mid}"/>`
    + `<path class="lane lane--biz" d="M${X(1)} ${hi}H${X(2)}C${m} ${hi} ${m} ${mid} ${X(3)} ${mid}"/>`
    + `<path class="lane lane--main" d="M${X(3)} ${mid}H${X(STOPS.length - 1)}"/>`
    + `<text class="lane-t" x="${X(1) + 12}" y="${hi - 11}">${T(U.laneBiz)}</text>`
    + `<text class="lane-t" x="${X(0) + 12}" y="${lo - 7}">${T(U.laneBank)}</text>`;
  STOPS.forEach(([y], i) => {
    const cy = i === 0 ? lo : i < 3 ? hi : mid;
    const cls = ['stop', i === 0 ? 'bank' : '', y === LAST ? 'end' : ''].join(' ');
    s += `<g class="${cls}" data-y="${y}" role="button" tabindex="0" aria-label="${y} ${T(U.year)}"><circle class="hit" cx="${X(i)}" cy="${cy}" r="20"/><circle class="dot" cx="${X(i)}" cy="${cy}" r="7.5"/><text class="yr" x="${X(i)}" y="${H - 4}">${y}</text></g>`;
  });
  scrub.setAttribute('viewBox', `0 0 ${W} ${H}`); scrub.setAttribute('height', H);
  scrub.innerHTML = s;
  markScrub();
}
function markScrub(){
  scrub.querySelectorAll('.stop').forEach(g => {
    const y = +g.dataset.y;
    g.classList.toggle('past', y <= year);
    g.classList.toggle('on', y === year);
    g.setAttribute('aria-pressed', String(y === year));
  });
}
function setYear(y){
  year = y;
  document.getElementById('capY').textContent = y;
  document.getElementById('capT').textContent = T(STOPS.find(s => s[0] === y)[1]);
  markScrub(); apply();
}

let builtC = 0;
function buildChart(){
  const W = cw.clientWidth; if (!W) return; builtC = W;
  const H = 300, t = 22, b = 42, max = 205, y = v => t + (H - t - b) * (1 - v / max);
  const band = W / CASH.length, X = i => Math.round(band * (i + .5)), bw = 24;
  const fsx = band < 80 ? ' style="font-size:10px"' : '';
  let s = `<line class="base" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  CASH.forEach((p, i) => {
    const x = X(i), top = y(p.c), hw = bw / 2, base = y(0), lx = T(p.x).split('|'), lab = lx.join(' ');
    s += `<path d="M${x - hw} ${base}V${top + 4}Q${x - hw} ${top} ${x - hw + 4} ${top}H${x + hw - 4}Q${x + hw} ${top} ${x + hw} ${top + 4}V${base}Z" fill="var(--fin)"><title>${lab}: ${eurM(p.c)}</title></path>`
      + `<text class="b-v" x="${x}" y="${top - 6}">${eur(p.c)}</text>`
      + (lx.length > 1 ? `<text class="x-t" x="${x}" y="${H - 22}"${fsx}>${lx[0]}</text><text class="x-t" x="${x}" y="${H - 8}"${fsx}>${lx[1]}</text>` : `<text class="x-t" x="${x}" y="${H - 8}">${lab}</text>`);
  });
  const known = CASH.map((p, i) => [p, i]).filter(([p]) => p.d != null);
  known.slice(1).forEach(([p, i], k) => {
    const [q, j] = known[k];
    s += `<line class="dep-l" x1="${X(j)}" y1="${y(q.d)}" x2="${X(i)}" y2="${y(p.d)}"/>`;
  });
  known.forEach(([p, i]) => {
    s += `<circle cx="${X(i)}" cy="${y(p.d)}" r="6" fill="var(--paper)"/><circle cx="${X(i)}" cy="${y(p.d)}" r="4" fill="var(--dep)"><title>${T(U.kd)}: ${eur(p.d)}</title></circle>`
      + `<text class="d-v" x="${X(i)}" y="${y(p.d) - 10}">${eur(p.d)}</text>`;
  });
  chart.setAttribute('viewBox', `0 0 ${W} ${H}`); chart.setAttribute('height', H);
  chart.innerHTML = s;
  /* keep two-line month labels inside the chart on narrow screens */
  const cols = {};
  chart.querySelectorAll('.x-t').forEach(t => { (cols[t.getAttribute('x')] = cols[t.getAttribute('x')] || []).push(t); });
  Object.values(cols).forEach(ts => {
    const bbs = ts.map(t => t.getBBox()), l = Math.min(...bbs.map(q => q.x)), r = Math.max(...bbs.map(q => q.x + q.width));
    const dx = r > W - 1 ? W - 1 - r : l < 1 ? 1 - l : 0;
    if (dx) ts.forEach(t => t.setAttribute('x', +t.getAttribute('x') + dx));
  });
}

  a1:{ d:L('2020 – октябрь 2026','2020 – oktobar 2026'), h:L('Версия прокуратуры: из банка выводятся ≈€390 млн','Verzija tužilaštva: iz banke se izvlači oko 390 mil. €'),
    t:L('Почти €370 млн записаны как выручка Alta Pay, но в хранилище не поступали, почти €17 млн вынесены физически. Macura отрицает вину.','Skoro 370 mil. € upisano je kao pazar Alta Pay, ali nije stiglo u trezor, skoro 17 mil. € izneto je fizički. Macura negira krivicu.'),

  m1:{ d:L('14 октября 2026','14. oktobar 2026'), h:L('Черногория не пускает Macura в страну','Crna Gora ne pušta Macuru u zemlju'),
    t:L('Ему отказывают во въезде в аэропорту Подгорицы и возвращают в Белград. По данным Vijesti, из соображений национальной безопасности, официального объяснения нет. Alta Group заявляет, что обжалует запрет.','U aerodromu u Podgorici odbijen mu je ulazak i vraćen je u Beograd. Prema Vijestima, iz razloga nacionalne bezbednosti, zvaničnog objašnjenja nema. Alta Group najavljuje žalbu.'),

  k1:{ d:L('27 октября 2026','27. oktobar 2026'), h:L('Сигнал о переводах за границу','Signal o transferima u inostranstvo'),
    t:L('Ninić пишет в X, НБС отвечает: обычные платёжные каналы. Прокуратура запрашивает у НБС переводы Alta banka с 27 сентября 2026, 29 октября 2026 снова.','Ninić piše na mreži X, NBS odgovara: redovni kanali platnog prometa. Tužilaštvo traži od NBS transfere Alta banke od 27. septembra 2026, 29. oktobra 2026. ponovo.'),

  k2:{ d:L('28–29 октября 2026','28–29. oktobar 2026'), h:L('Клиенты забирают ≈€140 млн','Klijenti povlače oko 140 mil. €'),

    t:L('Четыре вице-губернатора говорят, что реальное состояние банка узнали только здесь и оно «драстично» отличалось от отчётов.','Četiri viceguvernera kažu da su stvarno stanje banke saznali tek tada i da je „drastično” odstupalo od izveštaja.'),

  m4:{ key:1, d:L('31 октября 2026, ночь','31. oktobar 2026, noć'), h:L('НБС отзывает лицензию','NBS oduzima dozvolu'),
    t:L('Решает Исполнительный совет: губернатор и четыре вице-губернатора. Кто как голосовал, не сообщается. Управление банком переходит к Агентству.','Odlučuje Izvršni odbor: guvernerka i četiri viceguvernera. Ko je kako glasao, nije saopšteno. Upravljanje bankom prelazi na Agenciju.'),

  k6:{ d:L('31 октября 2026','31. oktobar 2026'), h:L('Запросы о проверке НБС','Zahtevi za proveru NBS'),

function openS(kind, id, from){ psel = kind === 'p' ? id : null; psev = kind === 'e' ? id : null; if (from && !from.closest('#psheet')) pBack = from; renderSheet(); const c = document.getElementById('pClose'); if (c) c.focus({ preventScroll: true }); }

const pgWide = matchMedia('(min-width: 900px)');
function pHead(x, y, ang){
  const h = 10, w = 5, bx = x - h * Math.cos(ang), by = y - h * Math.sin(ang);
  return `<polygon class="pg-h" points="${x},${y} ${(bx - w * Math.sin(ang)).toFixed(1)},${(by + w * Math.cos(ang)).toFixed(1)} ${(bx + w * Math.sin(ang)).toFixed(1)},${(by - w * Math.cos(ang)).toFixed(1)}"/>`;

function drawEdges(){

  const R = el => { const r = el.getBoundingClientRect(); return { l:r.left - B.left, r:r.right - B.left, t:r.top - B.top, b:r.bottom - B.top, cx:(r.left + r.right) / 2 - B.left, my:(r.top + r.bottom) / 2 - B.top }; };

        const sx = A.cx + (j - (next.length - 1) / 2) * (A.r - A.l) * .3, y0 = Math.max(A.b, rowR(it).b), g1 = (K.t - y0) / 2;
        s += `<path class="pg-e" d="M${sx} ${A.b} L${sx} ${y0} C${sx} ${y0 + g1} ${K.cx} ${K.t - g1} ${K.cx} ${K.t - 8}"/>` + pHead(K.cx, K.t, Math.PI / 2);
